  <text x="80" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Search default logins, factory reset guides, LED codes &amp; technical specs across 1,500+ models.</text>
  <text x="80" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Featuring client-side Subnet Calculators, Wi-Fi QR Code generators, and local gateway diagnostics.</text>

