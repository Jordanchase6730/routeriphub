  <g transform="translate(860, 410)">
    <rect x="0" y="0" width="240" height="100" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="16" y1="0" x2="60" y2="0" stroke="#ea580c" stroke-width="3"/>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">📱 Wi-Fi QR Generator</text>
