  <text x="100" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">NETWORK HARDWARE &amp; GATEWAY REFERENCE</text>

  <!-- Logo Icon -->
  <g transform="translate(80, 140)">
    <rect x="0" y="10" width="60" height="26" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="12" cy="23" r="3" fill="#38bdf8"/>
    <circle cx="26" cy="23" r="3" fill="#38bdf8"/>
    <circle cx="40" cy="23" r="3" fill="#38bdf8"/>
    
    <rect x="0" y="44" width="60" height="26" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="12" cy="57" r="3" fill="#38bdf8"/>
    <circle cx="26" cy="57" r="3" fill="#38bdf8"/>
    <circle cx="40" cy="57" r="3" fill="#22c55e"/>

